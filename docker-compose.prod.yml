# ==============================================================================
# Among Us: Live Deduction — Production Compose Stack
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ensure .env.production or environment variables are provided with:
#   DATABASE_URL, POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD,
#   NEXTAUTH_URL, NEXTAUTH_SECRET, PORT

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: among_us_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tournament_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-among_us_deduction}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: among_us_prod_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-among_us_deduction}
      POSTGRES_USER: ${POSTGRES_USER:-tournament_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tournament_user} -d ${POSTGRES_DB:-among_us_deduction}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_prod:
    driver: local
